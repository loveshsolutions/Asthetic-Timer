<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8f1ec"><meta name="description" content="A simple calming bell timer."><title>Calm Bell Timer</title><style>:root{--bg:#e8f1ec;--card:rgba(255,255,255,.74);--text:#30453b;--muted:#708278;--accent:#78998a;--dark:#5f8172;--ring:#b8cfc2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 15%,#fff,#eaf3ee 38%,#dce9e2);}.app{width:min(92vw,520px);padding:38px 28px 30px;text-align:center;background:var(--card);border:1px solid #fff;border-radius:32px;box-shadow:0 24px 70px #425c5026;backdrop-filter:blur(18px)}.bell{width:76px;height:76px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:#d7e7de;font-size:34px;box-shadow:0 8px 25px #425c501f}h1{margin:0;font-size:28px;font-weight:650;letter-spacing:-.6px}.subtitle{margin:8px 0 30px;color:var(--muted);font-size:14px}.timer-wrap{position:relative;width:min(72vw,320px);aspect-ratio:1;margin:0 auto 28px;display:grid;place-items:center}svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.track,.progress{fill:none;stroke-width:7}.track{stroke:var(--ring);opacity:.55}.progress{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}.time{font-size:clamp(52px,15vw,72px);font-variant-numeric:tabular-nums;font-weight:350;letter-spacing:-3px}.status{position:absolute;bottom:34px;font-size:12px;color:var(--muted)}.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}button{border:0;font:inherit;cursor:pointer;color:var(--text);background:#f5f8f6;padding:11px 16px;border-radius:999px;box-shadow:0 3px 12px #425c5014;transition:.18s}button:hover{transform:translateY(-1px);background:#fff}button.active{background:var(--accent);color:#fff}.controls{display:flex;justify-content:center;gap:10px}.controls button{min-width:112px;padding:13px 22px}.primary{background:var(--dark);color:#fff}.secondary{background:transparent;border:1px solid #c7d7cf}.custom{margin:0 auto 18px;display:none;gap:8px;justify-content:center}.custom.show{display:flex}input{width:95px;padding:11px 13px;border:1px solid #c7d7cf;border-radius:999px;background:#fff;color:var(--text);text-align:center;outline:0}.hint{margin-top:22px;font-size:12px;color:var(--muted)}@media(max-width:420px){.app{padding:30px 18px 24px}.presets button{padding:9px 13px}.controls button{min-width:105px}}</style></head><body><main class="app"><div class="bell" aria-hidden="true">◯</div><h1>Calm Bell Timer</h1><p class="subtitle">A quiet timer for focus, meditation, breathing, or simply pausing.</p><div class="timer-wrap" aria-live="polite"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="88"/><circle id="progress" class="progress" cx="100" cy="100" r="88"/></svg><div id="time" class="time">05:00</div><div id="status" class="status">Ready</div></div><div class="presets"><button data-min="1">1 min</button><button data-min="5" class="active">5 min</button><button data-min="10">10 min</button><button data-min="20">20 min</button><button id="customBtn">Custom</button></div><div id="custom" class="custom"><input id="minutes" type="number" min="1" max="180" value="15" aria-label="Custom minutes"><button id="setCustom" class="active">Set</button></div><div class="controls"><button id="start" class="primary">Start</button><button id="reset" class="secondary">Reset</button></div><div class="hint">A gentle bell sounds when the timer finishes.</div></main><script>(()=>{const t=document.getElementById('time'),s=document.getElementById('status'),p=document.getElementById('progress'),start=document.getElementById('start'),reset=document.getElementById('reset'),customBtn=document.getElementById('customBtn'),custom=document.getElementById('custom');const c=2*Math.PI*88;p.style.strokeDasharray=c;let total=300,remaining=300,running=false,timer=null,audio=null;function draw(){const m=Math.floor(remaining/60),x=remaining%60;t.textContent=String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');p.style.strokeDashoffset=c*(1-(total?remaining/total:0))}function stop(){if(timer){clearInterval(timer);timer=null}running=false;start.textContent='Start'}function setTimer(n){stop();total=remaining=n;s.textContent='Ready';draw()}function bell(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const now=audio.currentTime;[0,.65].forEach((d,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=i?660:520;g.gain.setValueAtTime(.0001,now+d);g.gain.exponentialRampToValueAtTime(.22,now+d+.03);g.gain.exponentialRampToValueAtTime(.0001,now+d+.9);o.connect(g).connect(audio.destination);o.start(now+d);o.stop(now+d+1)})}catch(e){}}function go(){if(remaining<=0)setTimer(total);if(running)return;running=true;s.textContent='Breathe and be here';start.textContent='Pause';timer=setInterval(()=>{remaining--;draw();if(remaining<=0){stop();s.textContent='Finished · take a moment';bell()}},1000)}start.onclick=()=>running?(stop(),s.textContent='Paused'):go();reset.onclick=()=>setTimer(total);document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-min]').forEach(x=>x.classList.remove('active'));b.classList.add('active');custom.classList.remove('show');setTimer(+b.dataset.min*60)});customBtn.onclick=()=>custom.classList.toggle('show');document.getElementById('setCustom').onclick=()=>{const n=Math.max(1,Math.min(180,+document.getElementById('minutes').value||15));document.querySelectorAll('[data-min]').forEach(x=>x.classList.remove('active'));setTimer(n*60);custom.classList.remove('show')};draw()})();</script></body></html>
